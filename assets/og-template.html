<!DOCTYPE html>
<!-- Source template for og-image.png (1200x630). Regenerate with:
     chrome --headless=new --force-device-scale-factor=2 --window-size=1200,630 \
       --screenshot=og-image.png file://.../assets/og-template.html -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0B0D0E; color: #F2F3F3; position: relative;
    font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased;
  }
  .tint { position: absolute; top: -340px; right: -180px; width: 820px; height: 820px; border-radius: 50%;
    background: radial-gradient(circle, rgba(157,221,224,0.07) 0%, transparent 64%); }
  .hairline { position: absolute; left: 72px; right: 72px; top: 118px; height: 1px; background: #25292A; }
  .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  .main { flex: 1; display: flex; align-items: center; gap: 60px; }
  .copy { flex: 1; }
  h1 { font-size: 72px; font-weight: 650; line-height: 1.05; letter-spacing: -0.03em; }
  h1 .grad { color: #9DDDE0; }
  .sub { margin-top: 30px; font-size: 19px; font-weight: 500; letter-spacing: 0;
    color: #92999A; }
  .sub b { color: #9DDDE0; font-weight: 500; }
  .ring-box { position: relative; width: 300px; height: 300px; flex-shrink: 0; }
  .ring-box svg { width: 100%; height: 100%; transform: rotate(-90deg); position: relative; }
  .ring-track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 16; }
  .ring-prog { fill: none; stroke: #9DDDE0; stroke-width: 16; stroke-linecap: round;
    stroke-dasharray: 653.45; stroke-dashoffset: 143.7; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-num { font-size: 92px; font-weight: 650; letter-spacing: -0.03em; line-height: 1;
    font-variant-numeric: tabular-nums; }
  .ring-cap { font-size: 15px; letter-spacing: 0.02em; color: #9DDDE0; margin-top: 12px; font-weight: 600; }
  .foot { display: flex; align-items: center; justify-content: space-between;
    font-size: 16px; letter-spacing: 0; color: #92999A; }
  .foot .cta { display: inline-flex; align-items: center; padding: 12px 26px; border-radius: 12px;
    background: #9DDDE0; color: #0B1416;
    font-weight: 600; font-size: 17px; letter-spacing: 0; }
</style>
</head>
<body>
  <div class="tint"></div>
  <div class="wrap">
    <div class="brand"><img src="../icon-192.png" alt=""> MyVitality</div>
    <div class="main">
      <div class="copy">
        <h1>Understand your body.<br><span class="grad">Train smarter.</span></h1>
        <div class="sub">Recovery <b>·</b> Sleep <b>·</b> Strain <b>·</b> Routes <b>·</b> Nutrition <b>·</b> AI Coach</div>
      </div>
      <div class="ring-box">
        <svg viewBox="0 0 240 240">
          <circle class="ring-track" cx="120" cy="120" r="104"></circle>
          <circle class="ring-prog" cx="120" cy="120" r="104"></circle>
        </svg>
        <div class="ring-center"><div class="ring-num">78</div><div class="ring-cap">Recovery</div></div>
      </div>
    </div>
    <div class="foot">
      <span>myvitality.fit</span>
      <span class="cta">Join the iOS beta</span>
    </div>
  </div>
</body>
</html>
