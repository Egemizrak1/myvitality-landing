<!DOCTYPE html>
<!-- Source template for og-image.png (1200x630). Regenerate with:
     chrome --headless=new --force-device-scale-factor=2 --window-size=1200,630 \
       --screenshot=og-image.png file://.../assets/og-template.html -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Semi+Condensed:wght@600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #FFFFFF; color: #111111; position: relative;
    font-family: "Barlow", sans-serif; -webkit-font-smoothing: antialiased;
  }
  .hairline { position: absolute; left: 72px; right: 72px; top: 118px; height: 1px; background: #E5E5E5; }
  .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 31px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; }
  .brand img { width: 40px; height: 40px; }
  .main { flex: 1; display: flex; align-items: center; gap: 60px; }
  .copy { flex: 1; }
  h1 { font-size: 84px; font-weight: 700; line-height: 1.0; letter-spacing: -0.03em; }
  h1 .grad { color: #6B6B6B; }
  .sub { margin-top: 30px; font-family: "Barlow Semi Condensed", "Barlow", sans-serif; font-size: 18px; font-weight: 600;
    letter-spacing: .09em; text-transform: uppercase; color: #6B6B6B; }
  .sub b { color: #A3A3A3; font-weight: 600; }
  /* The app's one dark card, with the recovery ring */
  .ring-card { width: 340px; height: 340px; flex-shrink: 0; border-radius: 28px; background: #111111;
    display: flex; align-items: center; justify-content: center; }
  .ring-box { position: relative; width: 260px; height: 260px; }
  .ring-box svg { width: 100%; height: 100%; transform: rotate(-90deg); position: relative; }
  .ring-track { fill: none; stroke: #2C2C2E; stroke-width: 16; }
  .ring-prog { fill: none; stroke: #FFFFFF; stroke-width: 16; stroke-linecap: round;
    stroke-dasharray: 653.45; stroke-dashoffset: 143.7; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #FFFFFF; }
  .ring-num { font-size: 92px; font-weight: 700; letter-spacing: -0.03em; line-height: 1;
    font-variant-numeric: tabular-nums; }
  .ring-cap { font-family: "Barlow Semi Condensed", "Barlow", sans-serif; font-size: 15px; letter-spacing: .09em;
    text-transform: uppercase; color: #9C9C9C; margin-top: 10px; font-weight: 600; }
  .foot { display: flex; align-items: center; justify-content: space-between;
    font-size: 19px; font-weight: 500; color: #6B6B6B; }
  .foot .cta { display: inline-flex; align-items: center; height: 56px; padding: 0 30px; border-radius: 999px;
    background: #111111; color: #FFFFFF; font-weight: 600; font-size: 19px; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="hairline"></div>
  <div class="wrap">
    <div class="brand"><img src="../logo.svg" alt=""> MyVitality</div>
    <div class="main">
      <div class="copy">
        <h1>Understand your body.<br><span class="grad">Train smarter.</span></h1>
        <div class="sub">Recovery <b>·</b> Sleep <b>·</b> Strain <b>·</b> Routes <b>·</b> Nutrition <b>·</b> AI Coach</div>
      </div>
      <div class="ring-card">
        <div class="ring-box">
          <svg viewBox="0 0 240 240">
            <circle class="ring-track" cx="120" cy="120" r="104"></circle>
            <circle class="ring-prog" cx="120" cy="120" r="104"></circle>
          </svg>
          <div class="ring-center"><div class="ring-num">78</div><div class="ring-cap">Recovery</div></div>
        </div>
      </div>
    </div>
    <div class="foot">
      <span>myvitality.fit</span>
      <span class="cta">Join the iOS beta</span>
    </div>
  </div>
</body>
</html>
