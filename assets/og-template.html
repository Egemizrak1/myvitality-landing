<!DOCTYPE html>
<!-- Source template for og-image.png (1200x630). Regenerate with:
     chrome --headless=new --force-device-scale-factor=2 --window-size=1200,630 \
       --screenshot=og-image.png file://.../assets/og-template.html -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,450..650;1,9..144,450..650&family=Manrope:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0A0908; color: #F5F1EA; position: relative;
    font-family: "Manrope", sans-serif; -webkit-font-smoothing: antialiased;
  }
  .glow-p { position: absolute; top: -340px; right: -180px; width: 820px; height: 820px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,71,0.20) 0%, transparent 64%); }
  .glow-c { position: absolute; bottom: -400px; left: -240px; width: 780px; height: 780px; border-radius: 50%;
    background: radial-gradient(circle, rgba(230,180,80,0.13) 0%, transparent 66%); }
  .hairline { position: absolute; left: 72px; right: 72px; top: 118px; height: 1px; background: rgba(255,255,255,0.08); }
  .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: "Fraunces"; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  .main { flex: 1; display: flex; align-items: center; gap: 60px; }
  .copy { flex: 1; }
  h1 { font-family: "Fraunces"; font-size: 74px; font-weight: 600; line-height: 1.02; letter-spacing: -0.016em; }
  h1 .grad { background: linear-gradient(120deg, #FF6B47, #E6B450); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-style: italic; padding-right: .05em; }
  .sub { margin-top: 30px; font-family: "Manrope", sans-serif; font-size: 17px; font-weight: 500;
    letter-spacing: 0.16em; color: #8A847A; text-transform: uppercase; }
  .sub b { color: #E6B450; font-weight: 500; }
  .ring-box { position: relative; width: 300px; height: 300px; flex-shrink: 0; }
  .ring-box::before { content:''; position: absolute; inset: -14%;
    background: radial-gradient(circle, rgba(255,107,71,0.22) 0%, transparent 62%); }
  .ring-box svg { width: 100%; height: 100%; transform: rotate(-90deg); position: relative; }
  .ring-track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 16; }
  .ring-prog { fill: none; stroke: url(#g); stroke-width: 16; stroke-linecap: round;
    stroke-dasharray: 653.45; stroke-dashoffset: 91.5; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-num { font-family: "Fraunces"; font-size: 92px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
  .ring-cap { font-family: "Manrope", sans-serif; font-size: 14px; letter-spacing: 0.34em; color: #FF6B47; margin-top: 12px; }
  .foot { display: flex; align-items: center; justify-content: space-between;
    font-family: "Manrope", sans-serif; font-size: 16px; letter-spacing: 0.06em; color: #8A847A; }
  .foot .cta { display: inline-flex; align-items: center; padding: 12px 26px; border-radius: 999px;
    background: linear-gradient(120deg, #FF6B47, #E6B450); color: #160B07;
    font-family: "Manrope"; font-weight: 600; font-size: 17px; letter-spacing: 0; }
</style>
</head>
<body>
  <div class="glow-p"></div>
  <div class="glow-c"></div>
  <div class="wrap">
    <div class="brand"><img src="../icon-192.png" alt=""> MyVitality</div>
    <div class="main">
      <div class="copy">
        <h1>Train with clarity,<br><span class="grad">not guesswork.</span></h1>
        <div class="sub">Workouts <b>·</b> Recovery <b>·</b> Sleep <b>·</b> Nutrition <b>·</b> AI Coach</div>
      </div>
      <div class="ring-box">
        <svg viewBox="0 0 240 240">
          <defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#FF6B47"/><stop offset="1" stop-color="#E6B450"/>
          </linearGradient></defs>
          <circle class="ring-track" cx="120" cy="120" r="104"></circle>
          <circle class="ring-prog" cx="120" cy="120" r="104"></circle>
        </svg>
        <div class="ring-center"><div class="ring-num">86</div><div class="ring-cap">RECOVERY</div></div>
      </div>
    </div>
    <div class="foot">
      <span>myvitality.fit</span>
      <span class="cta">Join the iOS beta</span>
    </div>
  </div>
</body>
</html>
